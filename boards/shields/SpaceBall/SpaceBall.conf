CONFIG_ZMK_POINTING=y
CONFIG_ZMK_MOUSE=y
CONFIG_ZMK_BLE=y

CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_PMW3610=y

# Start conservatively; adjust later if desired.
CONFIG_PMW3610_CPI=400
CONFIG_PMW3610_CPI_DIVIDOR=1

# The PCB schematic does not establish a sensor rotation, so start at 0 deg.
# Change to the appropriate orientation after physical bring-up.
CONFIG_PMW3610_ORIENTATION_0=y

# 125 Hz with software polling, matching the original roBa setup.
CONFIG_PMW3610_POLLING_RATE_125_SW=y

# Keep the sensor awake during initial bring-up.
# You can remove/comment this later to use the sensor's power-saving states.
CONFIG_PMW3610_FORCE_AWAKE=y
